<title>水波纹雾面马赛克</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:#e5e9f1;--text:#172033;--muted:#6e788b;--accent:#315cff;--accentSoft:#eef2ff;--danger:#c73535;--radius:18px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}body{min-height:100vh}button,input{font:inherit}.app{max-width:1180px;margin:auto;padding:16px 14px 88px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}h1{margin:0;font-size:30px;letter-spacing:-.03em}.sub{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}.badge{font-size:12px;font-weight:700;color:var(--accent);background:var(--accentSoft);padding:6px 10px;border-radius:999px;border:1px solid #dce4ff}.layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:0 8px 24px rgba(20,31,60,.05)}h2{font-size:18px;margin:0 0 10px}.actions,.mode-row,.zoom-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:9px 11px;font-weight:680;cursor:pointer;min-height:42px}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.soft{background:var(--accentSoft);color:var(--accent);border-color:#dce4ff}.btn.danger{color:var(--danger)}.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}.btn:disabled{opacity:.42}.file{display:none}.group{margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:14px;background:#fbfcfe}.gtitle{font-size:13px;font-weight:800;margin-bottom:9px}.field{margin-top:10px}.field:first-of-type{margin-top:0}.field label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;margin-bottom:5px}input[type=range]{width:100%}.shape-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.shape-grid .btn{padding:8px 7px;font-size:12px}.shape-grid .btn:first-child{grid-column:1/-1}.tip,.status{font-size:12px;color:var(--muted);line-height:1.55}.status{margin-top:8px;min-height:18px}.viewer{min-width:0}.stage{position:relative;overflow:auto;background:#edf1f7;border:1px dashed #cad2e1;border-radius:16px;min-height:560px;max-height:76vh;overscroll-behavior:contain}.stage.pan-mode{touch-action:pan-x pan-y}.shell{position:relative;margin:16px auto;transform-origin:top left}canvas{display:block;width:100%;height:100%}#viewCanvas{position:relative;z-index:1;touch-action:none}#previewCanvas{position:absolute;inset:0;z-index:2;pointer-events:none}.pan-mode #viewCanvas{touch-action:pan-x pan-y}.placeholder{padding:80px 20px;text-align:center;color:var(--muted);line-height:1.7}.zoom-row .zoom-range{flex:1;min-width:130px}.zoom-label{font-size:12px;color:var(--muted);min-width:44px;text-align:right}.small-btn{width:42px;padding:8px 0}.viewer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.viewer-head h2{margin:0}@media(max-width:900px){.layout{grid-template-columns:1fr}.stage{min-height:430px;max-height:none}}

<body>
<div class="app">
<div class="top"><div><h1>水波纹雾面马赛克</h1><div class="sub">自由画、圆形、方形、矩形、椭圆打码。照片可放大后精细涂抹。</div></div><div class="badge">GitHub Pages · iPad</div></div>
<div class="layout">
<section class="card">
<h2>工具</h2>
<div class="actions"><label for="fileInput" class="btn primary">导入照片</label><input id="fileInput" class="file" type="file" accept="image/*"><button id="shareBtn" class="btn soft" disabled>保存 / 分享</button><button id="exportBtn" class="btn" disabled>导出 PNG</button></div>
<div class="group"><div class="gtitle">操作模式</div><div class="mode-row"><button id="paintModeBtn" class="btn active">涂抹马赛克</button><button id="panModeBtn" class="btn">移动画布</button><button id="eraseModeBtn" class="btn">擦除马赛克</button></div><div id="interactionStatus" class="status">当前：涂抹马赛克</div></div>
<div class="group"><div class="gtitle">马赛克形状</div><div class="shape-grid"><button class="btn active" data-shape="free">✏️ 自由画</button><button class="btn" data-shape="circle">● 圆形笔刷</button><button class="btn" data-shape="square">■ 方形笔刷</button><button class="btn" data-shape="rect">▭ 矩形选区</button><button class="btn" data-shape="ellipse">⬭ 椭圆选区</button></div><div id="shapeHint" class="status">拖动手指自由涂抹。</div></div>
<div class="group"><div class="gtitle">照片缩放</div><div class="zoom-row"><button id="zoomOut" class="btn small-btn">−</button><input id="zoomRange" class="zoom-range" type="range" min="50" max="400" step="10" value="100"><button id="zoomIn" class="btn small-btn">＋</button><span id="zoomLabel" class="zoom-label">100%</span></div><div class="actions" style="margin-top:7px"><button id="fitBtn" class="btn">适应窗口</button><button id="zoom100Btn" class="btn">100%</button></div><div class="tip" style="margin-top:7px">放大后点“移动画布”拖看其他位置，再切回涂抹。</div></div>
<div class="group"><div class="gtitle">效果</div><div class="field"><label><span>笔刷 / 图形大小</span><span id="brushValue">64 px</span></label><input id="brushSize" type="range" min="16" max="260" step="2" value="64"></div><div class="field"><label><span>雾面强度</span><span id="fogValue">18</span></label><input id="fogStrength" type="range" min="2" max="36" step="1" value="18"></div><div class="field"><label><span>水波强度</span><span id="waveValue">10</span></label><input id="waveStrength" type="range" min="0" max="30" step="1" value="10"></div><div class="field"><label><span>颗粒强度</span><span id="pixelValue">7</span></label><input id="pixelSize" type="range" min="2" max="20" step="1" value="7"></div></div>
<div class="group"><div class="gtitle">编辑</div><div class="actions"><button id="undoBtn" class="btn" disabled>撤销</button><button id="redoBtn" class="btn" disabled>重做</button><button id="clearBtn" class="btn danger" disabled>清空马赛克</button><button id="rebuildBtn" class="btn" disabled>刷新效果</button></div></div>
<div class="group"><div class="gtitle">状态</div><div id="info" class="tip">请先导入一张照片。</div></div>
</section>
<section class="card viewer"><div class="viewer-head"><h2>照片</h2><div class="badge" id="canvasBadge">未导入</div></div><div id="stage" class="stage"><div id="placeholder" class="placeholder">导入照片后，在这里进行马赛克处理。</div><div id="shell" class="shell" hidden><canvas id="viewCanvas"></canvas><canvas id="previewCanvas"></canvas></div></div></section>
</div>
</div>
<script>
const $=id=>document.getElementById(id);const fileInput=$('fileInput'),view=$('viewCanvas'),vctx=view.getContext('2d',{willReadFrequently:true}),preview=$('previewCanvas'),pctx=preview.getContext('2d'),stage=$('stage'),shell=$('shell'),placeholder=$('placeholder'),shareBtn=$('shareBtn'),exportBtn=$('exportBtn'),undoBtn=$('undoBtn'),redoBtn=$('redoBtn'),clearBtn=$('clearBtn'),rebuildBtn=$('rebuildBtn'),brushSize=$('brushSize'),fogStrength=$('fogStrength'),waveStrength=$('waveStrength'),pixelSize=$('pixelSize'),zoomRange=$('zoomRange'),zoomLabel=$('zoomLabel'),info=$('info'),canvasBadge=$('canvasBadge');
const original=document.createElement('canvas'),octx=original.getContext('2d'),effect=document.createElement('canvas'),ectx=effect.getContext('2d'),mask=document.createElement('canvas'),mctx=mask.getContext('2d'),compose=document.createElement('canvas'),cctx=compose.getContext('2d'),waveCanvas=document.createElement('canvas'),wctx=waveCanvas.getContext('2d'),mini=document.createElement('canvas'),minictx=mini.getContext('2d');
let app={loaded:false,filename:'mosaic.png',mode:'paint',shape:'free',zoom:100,baseCssWidth:0,drawing:false,start:null,last:null,pointerId:null,maxSide:1800};let undoStack=[],redoStack=[],rebuildTimer=null;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function syncLabels(){$('brushValue').textContent=brushSize.value+' px';$('fogValue').textContent=fogStrength.value;$('waveValue').textContent=waveStrength.value;$('pixelValue').textContent=pixelSize.value;zoomLabel.textContent=app.zoom+'%'}syncLabels();
function setMode(mode){app.mode=mode;$('paintModeBtn').classList.toggle('active',mode==='paint');$('panModeBtn').classList.toggle('active',mode==='pan');$('eraseModeBtn').classList.toggle('active',mode==='erase');stage.classList.toggle('pan-mode',mode==='pan');$('interactionStatus').textContent=mode==='paint'?'当前：涂抹马赛克':mode==='erase'?'当前：擦除马赛克':'当前：移动画布'}$('paintModeBtn').onclick=()=>setMode('paint');$('panModeBtn').onclick=()=>setMode('pan');$('eraseModeBtn').onclick=()=>setMode('erase');
document.querySelectorAll('[data-shape]').forEach(btn=>{btn.onclick=()=>{app.shape=btn.dataset.shape;document.querySelectorAll('[data-shape]').forEach(x=>x.classList.toggle('active',x===btn));const h={free:'拖动手指自由涂抹。',circle:'拖动时连续盖上圆形马赛克。',square:'拖动时连续盖上方形马赛克。',rect:'从一个角拖到另一个角，松手生成矩形马赛克。',ellipse:'拖动框出范围，松手生成椭圆马赛克。'};$('shapeHint').textContent=h[app.shape]}});
function sizeCanvases(w,h){[original,effect,mask,compose,waveCanvas,view,preview].forEach(c=>{c.width=w;c.height=h})}
fileInput.onchange=e=>{const f=e.target.files?.[0];if(!f)return;app.filename=f.name.replace(/\.[^.]+$/,'')+'_mosaic.png';const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);const scale=Math.min(1,app.maxSide/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));sizeCanvases(w,h);octx.clearRect(0,0,w,h);octx.drawImage(img,0,0,w,h);mctx.clearRect(0,0,w,h);undoStack=[];redoStack=[];app.loaded=true;placeholder.hidden=true;shell.hidden=false;requestAnimationFrame(()=>{app.baseCssWidth=Math.min(w,Math.max(280,stage.clientWidth-32));app.zoom=100;zoomRange.value=100;applyZoom();buildEffect();render();updateButtons();info.textContent=`已导入 ${f.name}，编辑尺寸 ${w} × ${h}`;canvasBadge.textContent=`${w} × ${h}`})};img.onerror=()=>{URL.revokeObjectURL(url);alert('图片读取失败')};img.src=url;e.target.value=''};
function applyZoom(){if(!app.loaded)return;const ratio=view.height/view.width,cssW=app.baseCssWidth*(app.zoom/100);shell.style.width=cssW+'px';shell.style.height=(cssW*ratio)+'px';syncLabels()}
zoomRange.oninput=()=>{app.zoom=Number(zoomRange.value);applyZoom()};$('zoomOut').onclick=()=>{app.zoom=clamp(app.zoom-10,50,400);zoomRange.value=app.zoom;applyZoom()};$('zoomIn').onclick=()=>{app.zoom=clamp(app.zoom+10,50,400);zoomRange.value=app.zoom;applyZoom()};$('zoom100Btn').onclick=()=>{app.zoom=100;zoomRange.value=100;applyZoom()};$('fitBtn').onclick=()=>{if(!app.loaded)return;app.baseCssWidth=Math.min(view.width,Math.max(280,stage.clientWidth-32));app.zoom=100;zoomRange.value=100;applyZoom();stage.scrollLeft=0;stage.scrollTop=0};
[brushSize,fogStrength,waveStrength,pixelSize].forEach(el=>{el.oninput=()=>{syncLabels();if(el!==brushSize&&app.loaded){clearTimeout(rebuildTimer);rebuildTimer=setTimeout(()=>{buildEffect();render()},120)}}});
function buildEffect(){if(!app.loaded)return;const w=original.width,h=original.height,wave=Number(waveStrength.value),pix=Number(pixelSize.value),fog=Number(fogStrength.value);wctx.clearRect(0,0,w,h);const strip=8;for(let y=0;y<h;y+=strip){const sh=Math.min(strip,h-y),dx=Math.sin(y*.045)*wave+Math.sin(y*.013)*wave*.45,dy=Math.cos(y*.027)*wave*.12;wctx.drawImage(original,0,y,w,sh,dx,y+dy,w,sh)}const mw=Math.max(1,Math.floor(w/pix)),mh=Math.max(1,Math.floor(h/pix));mini.width=mw;mini.height=mh;minictx.clearRect(0,0,mw,mh);minictx.imageSmoothingEnabled=true;minictx.drawImage(waveCanvas,0,0,mw,mh);ectx.clearRect(0,0,w,h);ectx.save();ectx.imageSmoothingEnabled=true;if('filter' in ectx)ectx.filter=`blur(${Math.max(1,fog/3.2)}px)`;ectx.drawImage(mini,-8,-8,w+16,h+16);ectx.restore();ectx.fillStyle=`rgba(255,255,255,${Math.min(.16,.035+fog/400)})`;ectx.fillRect(0,0,w,h)}
function render(){if(!app.loaded)return;const w=view.width,h=view.height;vctx.clearRect(0,0,w,h);vctx.drawImage(original,0,0);cctx.clearRect(0,0,w,h);cctx.drawImage(effect,0,0);cctx.globalCompositeOperation='destination-in';cctx.drawImage(mask,0,0);cctx.globalCompositeOperation='source-over';vctx.drawImage(compose,0,0)}
function point(e){const r=view.getBoundingClientRect();return{x:(e.clientX-r.left)*(view.width/r.width),y:(e.clientY-r.top)*(view.height/r.height)}}
function saveHistory(){undoStack.push(mask.toDataURL('image/png'));if(undoStack.length>12)undoStack.shift();redoStack=[];updateButtons()}
async function restoreMask(data){await new Promise(resolve=>{const im=new Image();im.onload=()=>{mctx.clearRect(0,0,mask.width,mask.height);mctx.drawImage(im,0,0);resolve()};im.src=data});render();updateButtons()}
function hasMask(){if(!app.loaded)return false;const d=mctx.getImageData(0,0,mask.width,mask.height).data;for(let i=3;i<d.length;i+=4)if(d[i])return true;return false}
function updateButtons(){const ok=app.loaded;shareBtn.disabled=!ok;exportBtn.disabled=!ok;rebuildBtn.disabled=!ok;undoBtn.disabled=!undoStack.length;redoBtn.disabled=!redoStack.length;clearBtn.disabled=!ok||!hasMask()}
function maskOp(){mctx.globalCompositeOperation=app.mode==='erase'?'destination-out':'source-over';mctx.fillStyle='#fff';mctx.strokeStyle='#fff'}
function stamp(pt,shape=app.shape){const s=Number(brushSize.value),r=s/2;maskOp();if(shape==='square')mctx.fillRect(pt.x-r,pt.y-r,s,s);else{mctx.beginPath();mctx.arc(pt.x,pt.y,r,0,Math.PI*2);mctx.fill()}mctx.globalCompositeOperation='source-over'}
function lineStamp(a,b,shape){const dist=Math.hypot(b.x-a.x,b.y-a.y),step=Math.max(4,Number(brushSize.value)*.22),n=Math.max(1,Math.ceil(dist/step));for(let i=0;i<=n;i++){const t=i/n;stamp({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t},shape)}}
function drawPreview(a,b){pctx.clearRect(0,0,preview.width,preview.height);if(!a||!b)return;pctx.save();pctx.strokeStyle='rgba(49,92,255,.95)';pctx.lineWidth=Math.max(2,view.width/700*2);pctx.setLineDash([10,7]);const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);if(app.shape==='rect')pctx.strokeRect(x,y,w,h);else{pctx.beginPath();pctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);pctx.stroke()}pctx.restore()}
function commitArea(a,b){maskOp();const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);if(app.shape==='rect')mctx.fillRect(x,y,w,h);else{mctx.beginPath();mctx.ellipse(x+w/2,y+h/2,Math.max(.5,w/2),Math.max(.5,h/2),0,0,Math.PI*2);mctx.fill()}mctx.globalCompositeOperation='source-over'}
view.addEventListener('pointerdown',e=>{if(!app.loaded||app.mode==='pan')return;e.preventDefault();saveHistory();app.drawing=true;app.pointerId=e.pointerId;app.start=point(e);app.last=app.start;try{view.setPointerCapture(e.pointerId)}catch(_){}if(app.shape==='free'||app.shape==='circle'||app.shape==='square'){stamp(app.start,app.shape==='free'?'circle':app.shape);render()}else drawPreview(app.start,app.start)});
view.addEventListener('pointermove',e=>{if(!app.drawing||e.pointerId!==app.pointerId)return;e.preventDefault();const q=point(e);if(app.shape==='free')lineStamp(app.last,q,'circle');else if(app.shape==='circle'||app.shape==='square')lineStamp(app.last,q,app.shape);else drawPreview(app.start,q);app.last=q;if(app.shape!=='rect'&&app.shape!=='ellipse')render()});
function finishDraw(e){if(!app.drawing||e.pointerId!==app.pointerId)return;const q=point(e);if(app.shape==='rect'||app.shape==='ellipse'){commitArea(app.start,q);pctx.clearRect(0,0,preview.width,preview.height)}app.drawing=false;app.start=null;app.last=null;app.pointerId=null;try{view.releasePointerCapture(e.pointerId)}catch(_){}render();updateButtons()}view.addEventListener('pointerup',finishDraw);view.addEventListener('pointercancel',()=>{pctx.clearRect(0,0,preview.width,preview.height);app.drawing=false;app.pointerId=null});
undoBtn.onclick=async()=>{if(!undoStack.length)return;redoStack.push(mask.toDataURL('image/png'));await restoreMask(undoStack.pop())};redoBtn.onclick=async()=>{if(!redoStack.length)return;undoStack.push(mask.toDataURL('image/png'));await restoreMask(redoStack.pop())};clearBtn.onclick=()=>{if(!app.loaded)return;saveHistory();mctx.clearRect(0,0,mask.width,mask.height);render();updateButtons()};rebuildBtn.onclick=()=>{if(app.loaded){buildEffect();render();info.textContent='水波雾面效果已刷新。'}};
function outputBlob(){return new Promise(resolve=>{const out=document.createElement('canvas');out.width=view.width;out.height=view.height;const x=out.getContext('2d');x.drawImage(original,0,0);const t=document.createElement('canvas');t.width=view.width;t.height=view.height;const tx=t.getContext('2d');tx.drawImage(effect,0,0);tx.globalCompositeOperation='destination-in';tx.drawImage(mask,0,0);tx.globalCompositeOperation='source-over';x.drawImage(t,0,0);out.toBlob(resolve,'image/png')})}
exportBtn.onclick=async()=>{const blob=await outputBlob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=app.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);info.textContent='PNG 已导出。'};shareBtn.onclick=async()=>{const blob=await outputBlob(),file=new File([blob],app.filename,{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'水波纹雾面马赛克'});info.textContent='系统分享已打开，可选择“存储到照片”。'}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=app.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);info.textContent='当前环境不支持文件分享，已改为下载。'}}catch(_){info.textContent='分享已取消。'}};
window.addEventListener('resize',()=>{if(app.loaded&&app.zoom===100){app.baseCssWidth=Math.min(view.width,Math.max(280,stage.clientWidth-32));applyZoom()}});if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}syncLabels();updateButtons();
</script>
</body>
